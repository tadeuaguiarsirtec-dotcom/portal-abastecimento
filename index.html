<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5a623">
  <title>Consulta de Postos Homologados - Sirtec</title>

  <style>
    :root {
      --sirtec-laranja: #f5a623;
      --sirtec-vermelho: #e51f35;
      --sirtec-marrom: #211a17;
      --sirtec-cinza: #6b625d;
      --fundo: #f5f4f2;
      --branco: #ffffff;
      --borda: #e2dedb;
      --verde: #198754;
      --verde-escuro: #146c43;
      --alerta: #fff4d6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--fundo);
      color: var(--sirtec-marrom);
    }

    header {
      background: var(--branco);
      text-align: center;
      padding: 22px 16px 18px;
      border-bottom: 5px solid var(--sirtec-laranja);
      box-shadow: 0 3px 12px rgba(33, 26, 23, 0.10);
    }

    .logo {
      width: 290px;
      max-width: 88%;
      display: block;
      margin: 0 auto 12px;
    }

    header h1 {
      margin: 0 0 5px;
      font-size: 27px;
    }

    header p {
      margin: 0;
      color: var(--sirtec-cinza);
      font-size: 14px;
    }

    main {
      width: min(920px, 94%);
      margin: 22px auto;
    }

    .aviso {
      background: var(--alerta);
      border-left: 5px solid var(--sirtec-laranja);
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .busca {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--borda);
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 18px;
      background: var(--branco);
    }

    .titulo-secao {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .regionais {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
      margin-bottom: 24px;
    }

    .botao-regional {
      border: 2px solid var(--sirtec-laranja);
      background: var(--branco);
      color: var(--sirtec-marrom);
      padding: 16px 10px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(33, 26, 23, 0.08);
    }

    .botao-regional.ativo {
      background: linear-gradient(135deg, var(--sirtec-laranja), var(--sirtec-vermelho));
      color: var(--branco);
      border-color: transparent;
    }

    .nome-regional {
      color: var(--sirtec-vermelho);
      margin: 0 0 15px;
      font-size: 23px;
    }

    .cidade {
      background: var(--branco);
      border-radius: 12px;
      padding: 17px;
      margin-bottom: 17px;
      box-shadow: 0 3px 12px rgba(33, 26, 23, 0.08);
      border-top: 4px solid var(--sirtec-laranja);
    }

    .cidade h3 {
      margin: 0 0 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--borda);
      font-size: 21px;
    }

    .posto {
      border: 1px solid var(--borda);
      border-left: 4px solid var(--sirtec-vermelho);
      border-radius: 9px;
      padding: 14px;
      margin-bottom: 13px;
    }

    .posto:last-child { margin-bottom: 0; }

    .posto h4 {
      margin: 0 0 10px;
      font-size: 17px;
    }

    .rotulo {
      font-size: 13px;
      color: var(--sirtec-cinza);
      font-weight: bold;
      margin-bottom: 8px;
    }

    .combustiveis {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .combustivel {
      background: #edf8f2;
      color: var(--verde-escuro);
      border: 1px solid #b9dec9;
      padding: 8px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
    }

    .botao-mapa {
      display: block;
      margin-top: 13px;
      background: var(--verde);
      color: var(--branco);
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      padding: 12px;
      border-radius: 8px;
    }

    .botao-mapa:hover { background: var(--verde-escuro); }

    .mensagem {
      background: var(--branco);
      border: 1px solid var(--borda);
      border-radius: 10px;
      padding: 22px;
      text-align: center;
      color: var(--sirtec-cinza);
    }

    footer {
      text-align: center;
      padding: 18px;
      background: var(--sirtec-marrom);
      color: var(--branco);
      font-size: 12px;
      margin-top: 30px;
      border-top: 4px solid var(--sirtec-vermelho);
    }

    @media (max-width: 600px) {
      .regionais { grid-template-columns: 1fr; }
      header h1 { font-size: 22px; }
      .logo { width: 245px; }
    }
  </style>
</head>

  const botoesRegionais = document.getElementById("botoesRegionais");
  const conteudo = document.getElementById("conteudo");
  const busca = document.getElementById("busca");
  let regionalAtiva = null;

  function escapar(texto) {
    return String(texto)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function criarBotoes() {
    botoesRegionais.innerHTML = dados.map(regional => `
      <button class="botao-regional" data-id="${regional.id}">
        ${escapar(regional.nome)}
      </button>
    `).join("");

    document.querySelectorAll(".botao-regional").forEach(botao => {
      botao.addEventListener("click", () => selecionarRegional(botao.dataset.id));
    });
  }

  function selecionarRegional(id) {
    regionalAtiva = id;
    busca.value = "";

    document.querySelectorAll(".botao-regional").forEach(botao => {
      botao.classList.toggle("ativo", botao.dataset.id === id);
    });

    renderizar();
  }

function renderizar() {
  const termo = busca.value.trim().toLocaleLowerCase("pt-BR");

  // Quando existe uma pesquisa, procura em todas as regionais
  if (termo) {
    const resultados = dados
      .map(regional => {
        const cidades = regional.cidades
          .map(cidade => {
            const cidadeCombina = cidade.nome
              .toLocaleLowerCase("pt-BR")
              .includes(termo);

            const postos = cidade.postos.filter(posto =>
              cidadeCombina ||
              posto.nome.toLocaleLowerCase("pt-BR").includes(termo) ||
              posto.combustiveis.some(combustivel =>
                combustivel.toLocaleLowerCase("pt-BR").includes(termo)
              )
            );

            return {
              ...cidade,
              postos
            };
          })
          .filter(cidade => cidade.postos.length);

        return {
          ...regional,
          cidades
        };
      })
      .filter(regional => regional.cidades.length);

    document.querySelectorAll(".botao-regional").forEach(botao => {
      botao.classList.remove("ativo");
    });

    if (!resultados.length) {
      conteudo.innerHTML = `
        <div class="mensagem">
          Nenhuma cidade, posto ou combustível encontrado.
        </div>
      `;
      return;
    }

    conteudo.innerHTML = resultados.map(regional => `
      <section>
        <h2 class="nome-regional">
          Regional ${escapar(regional.nome)}
        </h2>

        ${regional.cidades.map(cidade => `
          <article class="cidade">
            <h3>${escapar(cidade.nome)}</h3>

            ${cidade.postos.map(posto => `
              <div class="posto">
                <h4>${escapar(posto.nome)}</h4>

                <div class="rotulo">
                  COMBUSTÍVEIS INDICADOS
                </div>

                <div class="combustiveis">
                  ${posto.combustiveis.map(combustivel => `
                    <span class="combustivel">
                      ✓ ${escapar(combustivel)}
                    </span>
                  `).join("")}
                </div>

                <a
                  class="botao-mapa"
                  href="${escapar(posto.maps)}"
                  target="_blank"
                  rel="noopener noreferrer">
                  Abrir no Google Maps
                </a>
              </div>
            `).join("")}
          </article>
        `).join("")}
      </section>
    `).join("");

    return;
  }

  // Sem pesquisa, mantém a navegação normal por regional
  if (!regionalAtiva) {
    conteudo.innerHTML = `
      <div class="mensagem">
        Escolha uma regional ou pesquise uma cidade, posto ou combustível.
      </div>
    `;
    return;
  }

  const regional = dados.find(item => item.id === regionalAtiva);

  if (!regional.cidades.length) {
    conteudo.innerHTML = `
      <h2 class="nome-regional">
        Regional ${escapar(regional.nome)}
      </h2>

      <div class="mensagem">
        Os postos desta regional ainda serão cadastrados.
      </div>
    `;
    return;
  }

  conteudo.innerHTML = `
    <h2 class="nome-regional">
      Regional ${escapar(regional.nome)}
    </h2>

    ${regional.cidades.map(cidade => `
      <article class="cidade">
        <h3>${escapar(cidade.nome)}</h3>

        ${cidade.postos.map(posto => `
          <div class="posto">
            <h4>${escapar(posto.nome)}</h4>

            <div class="rotulo">
              COMBUSTÍVEIS INDICADOS
            </div>

            <div class="combustiveis">
              ${posto.combustiveis.map(combustivel => `
                <span class="combustivel">
                  ✓ ${escapar(combustivel)}
                </span>
              `).join("")}
            </div>

            <a
              class="botao-mapa"
              href="${escapar(posto.maps)}"
              target="_blank"
              rel="noopener noreferrer">
              Abrir no Google Maps
            </a>
          </div>
        `).join("")}
      </article>
    `).join("")}
  `;
}

busca.addEventListener("input", renderizar);

  criarBotoes();
</script>
